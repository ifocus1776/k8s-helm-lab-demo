---
# Default values for hello-lab.
# Everything an environment might need to change lives here, so a deployment
# is fully described by: chart version + values file(s). That is the IaC idea.

replicaCount: 2

image:
  # podinfo: a tiny Go web app built for Kubernetes demos (non-root, has /healthz and /readyz).
  repository: ghcr.io/stefanprodan/podinfo
  # Pinned tag. Never use "latest" in IaC; it makes deployments non-reproducible.
  tag: "6.17.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# App configuration rendered into a ConfigMap. Changing it triggers a rolling
# restart automatically (see the checksum/config annotation in deployment.yaml).
app:
  environment: lab
  message: "Hello from Helm on Kubernetes!"
  color: "#34577c"
  logLevel: info

serviceAccount:
  create: true
  # The app never talks to the Kubernetes API, so don't mount a token.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# Port the container listens on.
containerPort: 9898

ingress:
  # On by default because k3s ships Traefik; set false on clusters without an ingress controller.
  enabled: true
  # k3s ships Traefik as its default ingress controller.
  className: traefik
  annotations: {}
  # *.localtest.me resolves to 127.0.0.1 in public DNS, handy for a desktop lab.
  host: hello-lab.localtest.me
  path: /
  pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 3

# HorizontalPodAutoscaler (k3s includes metrics-server, so this works out of the box).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
