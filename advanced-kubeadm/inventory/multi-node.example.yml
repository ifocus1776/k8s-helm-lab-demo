---
# Copy to inventory/multi-node.yml and edit. Three Debian 12/13 VMs reachable over SSH.
#   ansible-playbook -i inventory/multi-node.yml site.yml -K
all:
  vars:
    k8s_single_node: false
    ansible_user: debian            # Debian cloud images default to "debian"; use your own account on installed systems
    ansible_python_interpreter: /usr/bin/python3
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 10.0.10.11
    workers:
      hosts:
        w1:
          ansible_host: 10.0.10.21
        w2:
          ansible_host: 10.0.10.22
